upstream sod_app {
    server unix:/run/gunicorn/sod.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 100M;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /opt/sod/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Медиа намеренно internal: файлы отдаются через Django
    # /download/<version_id>/ после проверки прав.
    location /media/ {
        internal;
        alias /opt/sod/media/;
    }

    location / {
        proxy_pass http://sod_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
