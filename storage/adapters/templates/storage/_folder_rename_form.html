<form method="post" action="{% url 'storage:folder_rename' folder.pk %}"
      data-gost-kind="folder"
      data-gost-base="{{ folder.project.base_code }}"
      data-gost-section="{{ folder.section.code|default:'' }}">
    {% csrf_token %}
    <div class="modal-body">
        <label for="folderCodeInput" class="form-label">Шифр папки</label>
        <input type="text"
               class="form-control mb-3"
               id="folderCodeInput"
               name="code"
               maxlength="10"
               inputmode="numeric"
               pattern="[0-9]+"
               value="{{ folder.code }}"
               required
               data-gost-folder-code
               placeholder="Например, 01">

        <label for="folderRenameInput" class="form-label">Название папки</label>
        <input type="text"
               class="form-control"
               id="folderRenameInput"
               name="name"
               maxlength="255"
               required
               autofocus
               value="{{ folder.name }}">

        <label for="folderRenameFullCode" class="form-label mt-3">Полный шифр</label>
        <input type="text"
               class="form-control"
               id="folderRenameFullCode"
               readonly
               data-gost-preview>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
        <button type="submit" class="btn btn-primary btn-sm">Сохранить</button>
    </div>
</form>
