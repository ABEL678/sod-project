{% extends 'storage/base.html' %}

{% block title %}404 — Страница не найдена — Stream-CAD{% endblock %}

{% block content %}
<main id="main-content" class="cde-error-page">
    <section class="cde-error-card" aria-labelledby="error-title">
        <div class="cde-error-icon" aria-hidden="true">
            <i class="bi bi-compass"></i>
        </div>
        <div class="cde-error-code">404</div>
        <h1 id="error-title" class="cde-error-title">Страница не найдена</h1>
        <p class="cde-error-text">
            Возможно, ссылка устарела, документ удалён или у вас нет доступа.
        </p>
        <div class="cde-error-actions">
            <a class="btn btn-primary" href="{% url 'storage:project_list' %}">
                <i class="bi bi-house-door me-1" aria-hidden="true"></i>На главную
            </a>
            <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Назад
            </button>
        </div>
    </section>
</main>
{% endblock %}
