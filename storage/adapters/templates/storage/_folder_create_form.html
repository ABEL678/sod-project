<form method="post" action="{% url 'storage:folder_create' project.pk %}"
      data-gost-kind="folder"
      data-gost-base="{{ project.base_code }}"
      data-gost-section="{{ section.code|default:'' }}">
    {% csrf_token %}
    <div class="modal-body">
        <input type="hidden" name="section" value="{{ section.pk|default:'' }}">
        <input type="hidden" name="parent" value="{{ parent.pk|default:'' }}">

        {% if parent %}
            <p class="small text-muted mb-2">
                Вложенная папка в «{{ parent.name }}»
            </p>
        {% elif section %}
            <p class="small text-muted mb-2">
                Папка в разделе {{ section.code }} — {{ section.name }}
            </p>
        {% endif %}

        <label for="folderCodeInput" class="form-label">Шифр папки</label>
        <input type="text"
               class="form-control mb-3"
               id="folderCodeInput"
               name="code"
               maxlength="10"
               inputmode="numeric"
               pattern="[0-9]+"
               required
               data-gost-folder-code
               placeholder="Например, 01">

        <label for="folderNameInput" class="form-label">Название папки</label>
        <input type="text"
               class="form-control"
               id="folderNameInput"
               name="name"
               maxlength="255"
               required
               autofocus
               placeholder="Например, Рабочая документация">

        <label for="folderFullCodePreview" class="form-label mt-3">Полный шифр</label>
        <input type="text"
               class="form-control"
               id="folderFullCodePreview"
               readonly
               data-gost-preview>

        <div class="form-text text-muted mt-3">
            Создавать и менять структуру могут только ГИП и Администратор.
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
        <button type="submit" class="btn btn-primary btn-sm">
            <i class="bi bi-folder-plus me-1" aria-hidden="true"></i>Создать папку
        </button>
    </div>
</form>
