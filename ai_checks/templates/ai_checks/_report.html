{% comment %}
Ф4: вкладка «Отчёт ГИПу» — период и генерация сводки (HTMX).
{% endcomment %}
<div class="toolbar" data-role="ai-report-toolbar">
  <span class="fw-semibold">
    <i class="bi bi-file-earmark-bar-graph me-1" aria-hidden="true"></i>
    Отчёт ГИПу по подтверждённым замечаниям
  </span>
  <span class="toolbar-spacer"></span>
  <span class="text-muted small">
    Резюме — DeepSeek; без ключа используется локальная заглушка
  </span>
</div>

<form class="d-flex flex-wrap gap-2 align-items-end px-2 pt-2"
      hx-post="{% url 'ai_checks:report_generate' project.pk %}"
      hx-target="#aiReportResults"
      hx-swap="innerHTML">
  {% csrf_token %}
  <div>
    <label class="form-label small mb-1" for="reportPeriodStart">Начало</label>
    <input type="date" class="form-control form-control-sm"
           id="reportPeriodStart" name="period_start"
           value="{{ default_start }}" required>
  </div>
  <div>
    <label class="form-label small mb-1" for="reportPeriodEnd">Конец</label>
    <input type="date" class="form-control form-control-sm"
           id="reportPeriodEnd" name="period_end"
           value="{{ default_end }}" required>
  </div>
  <button type="submit" class="btn btn-sm btn-primary text-nowrap">
    <i class="bi bi-stars me-1" aria-hidden="true"></i>Сгенерировать
  </button>
</form>

<div id="aiReportResults" class="px-2 pt-2"></div>
