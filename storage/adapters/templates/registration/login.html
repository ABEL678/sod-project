{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — СОД</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body class="bg-light">
<main class="container" style="max-width: 420px; margin-top: 10vh;">
    <div class="text-center mb-4">
        <h1 class="h3">СОД</h1>
        <div class="text-muted">Среда общих данных</div>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 class="h5 mb-4">Вход в систему</h2>

            {% if form.non_field_errors %}
                <div class="alert alert-danger">{{ form.non_field_errors }}</div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Имя пользователя</label>
                    <input type="text"
                           name="{{ form.username.html_name }}"
                           id="{{ form.username.id_for_label }}"
                           class="form-control"
                           value="{{ form.username.value|default:'' }}"
                           autocomplete="username"
                           required autofocus>
                    {% for error in form.username.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                </div>

                <div class="mb-3">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
                    <input type="password"
                           name="{{ form.password.html_name }}"
                           id="{{ form.password.id_for_label }}"
                           class="form-control"
                           autocomplete="current-password"
                           required>
                    {% for error in form.password.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                </div>

                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
